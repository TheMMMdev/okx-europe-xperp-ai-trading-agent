name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22.15.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - working-directory: frontend
        run: npm ci
      - run: python scripts/release_preflight.py
      - name: Full backend suite
        if: matrix.python-version == '3.11'
        env:
          ASTRA_TESTING: "1"
          ASTRA_CLEAN_PUBLIC_CHECKOUT: "1"
        run: python -m unittest discover -s tests
      - name: Python 3.12 compatibility
        if: matrix.python-version == '3.12'
        env:
          ASTRA_TESTING: "1"
          ASTRA_CLEAN_PUBLIC_CHECKOUT: "1"
        run: |
          python -m compileall -q astra_backend astra_gateway scripts
          python -m unittest \
            tests.core.test_listing_gate \
            tests.trading.test_order_lifecycle_semantics \
            tests.venues.test_okx_rest \
            tests.venues.test_xperp_execution

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.15.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx vue-tsc --noEmit -p tsconfig.app.json
      - working-directory: frontend
        run: npm run build
      - working-directory: frontend
        run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t quant-agent-eu:ci .
